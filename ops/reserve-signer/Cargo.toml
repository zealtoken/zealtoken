[package]
name = "zeal-reserve-signer"
version = "0.1.0"
edition = "2024"

[dependencies]
zcash_primitives = { version = "=0.30.0", default-features = false, features = ["std", "transparent-inputs"] }
zcash_protocol = "=0.10.0"
transparent = { package = "zcash_transparent", version = "=0.10.0", features = ["transparent-inputs"] }
secp256k1 = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bs58 = { version = "0.5", features = ["check"] }
